name: Bug Report
description: Report something that is broken
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What happened, and what did you expect instead? The expected behaviour is the outcome being asked for. If you also suggest a fix, say it is a suggestion.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run '...'
        2. See the error
    validations:
      required: true

  - type: dropdown
    id: origin
    attributes:
      label: Origin
      description: Where did the behaviour that broke come from? Leave this unanswered only if you have not looked. "Not traced" means you looked and could not tell.
      options:
        - An earlier issue or pull request delivered it (name it below)
        - Never worked
        - Not traced
    validations:
      required: false

  - type: input
    id: origin_ref
    attributes:
      label: Origin reference
      description: The issue or pull request that delivered it, or what you tried when tracing it.
      placeholder: "e.g., #123, or: read the closed pull requests touching this file, none introduces it"
    validations:
      required: false

  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Paste the error text, if there is one.
      render: shell
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, versions, and anything else about where this happened.
    validations:
      required: false
