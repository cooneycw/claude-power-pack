# .claude/cicd_tasks.yml - Task manifest for CI/CD runner
#
# Defines steps (what to run) and plans (which steps to run together).
# The runner loads this manifest when present; falls back to built-in defaults otherwise.
#
# Reference:
#   steps.<name>.command     - Shell command to execute
#   steps.<name>.timeout     - Max seconds (default: 600)
#   steps.<name>.max_attempts - Retry count (default: 1)
#   steps.<name>.idempotent  - Safe to retry? (default: true)
#   steps.<name>.skip_if     - Shell expression; skip if exits 0
#   steps.<name>.artifacts   - Output files to preserve
#   steps.<name>.rollback    - Command to run on failure
#   plans.<name>.steps       - Ordered list of step names
#

version: "1"

steps:
  lint:
    command: make lint
    description: Run ruff linter
    timeout: 300
    skip_if: '! grep -q "^lint:" Makefile 2>/dev/null'

  test:
    command: make test
    description: Run pytest suite
    timeout: 600
    skip_if: '! grep -q "^test:" Makefile 2>/dev/null'

  typecheck:
    command: make typecheck
    description: Run mypy type checker
    timeout: 300
    skip_if: '! grep -q "^typecheck:" Makefile 2>/dev/null'

  security_scan:
    # No hardcoded PYTHONPATH: this manifest only runs with the runner's cwd at
    # the CPP repo root, so `lib.security` / `lib.cicd.bootstrap` resolve via
    # cwd. The old `${HOME}/Projects/claude-power-pack/lib` prefix was both wrong
    # for `-m lib.<pkg>` (that needs the parent of lib/) and broke under a
    # sandbox or alternate checkout (issue #534).
    command: python3 -m lib.security gate flow_finish
    description: Run security quick scan
    timeout: 120
    skip_if: "! python3 -c 'import lib.security' 2>/dev/null"

  verify:
    # THE FINISH PLAN BELOW MUST REFERENCE THIS, not merely define it (issue
    # #1147, and #617 before it wrote the same warning four lines down). This
    # manifest WINS over lib/cicd/steps.py BUILTIN_PLANS, so the `verify` StepDef
    # added to the built-in finish plan was dead config here: the runner declared
    # five gates in its JSON, executed four, recorded nothing as skipped, and
    # printed `ok` - a worse version of the defect #1147 exists to remove,
    # produced by the fix for it. Measured, not reasoned about: the gate ran in
    # 163.68s, the same figure as before the change, which is what gave it away.
    #
    # The timeout is 1800 to match the built-in step: `make verify` measured
    # 229.8s on this repository and grows with the suite, and a gate killed by
    # its own budget reports a timeout rather than a result (issue #812).
    command: make verify
    description: Run the repository's full verification pipeline (make verify)
    timeout: 1800
    skip_if: '! grep -q "^verify:" Makefile 2>/dev/null'

  deploy_security_scan:
    command: python3 -m lib.security gate flow_deploy
    description: Run security scan before deploy
    timeout: 120
    skip_if: "! python3 -c 'import lib.security' 2>/dev/null"

  bootstrap_check:
    command: python3 -m lib.cicd.bootstrap check
    description: Check admin-only bootstrap dependencies are satisfied
    timeout: 30
    skip_if: '! [ -f .claude/bootstrap.yaml ]'

  drift_check:
    command: make drift-check
    description: Detect drift between repo templates and host-installed artifacts
    timeout: 60
    skip_if: '! [ -x scripts/drift-detect.sh ]'

  deploy:
    command: make deploy
    description: Run deployment
    timeout: 1800
    idempotent: false

plans:
  # typecheck is listed in every plan that gates a PR, not merely defined under
  # `steps:` above. This manifest WINS over lib/cicd/steps.py BUILTIN_PLANS, so
  # a typecheck step defined but never referenced is dead config - which is how
  # the finish gate reported ok on trees CI then rejected on `make typecheck`
  # (issue #617). The .woodpecker.yml `validate` step runs mypy, so omitting it
  # here guarantees local-green-then-CI-red.
  finish:
    description: Quality gates for /flow:finish
    steps:
      - lint
      - test
      - typecheck
      - security_scan
      - verify

  check:
    description: Quick quality check for /flow:check
    steps:
      - lint
      - test
      - typecheck

  deploy:
    description: Deployment pipeline for /flow:deploy
    steps:
      - bootstrap_check
      - deploy_security_scan
      - drift_check
      - deploy
