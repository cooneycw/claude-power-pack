[project]
name = "claude-power-pack"
version = "8.0.0"
requires-python = ">=3.11"
# pydantic/pyyaml are runtime deps of lib.cicd (hard imports on the CLI chain);
# keeping them out of the dev extra lets `uv run --project` provision a working
# runner env in fresh checkouts/worktrees (issue #500).
dependencies = ["pydantic>=2.0", "pyyaml>=6.0"]

[project.optional-dependencies]
# pytest-xdist: the suite is spawn-bound, not CPU-bound (issue #1086) - 70 of 119
# test modules import `subprocess`, and two serial runs recorded 83% and 77% of ONE
# core on a 24-core box with system time exceeding user time. `make test` and the CI
# `validate` step both pass an EXPLICIT `-n`, never `auto`; scripts/pytest-workers.sh
# owns the cap and refuses `auto` outright.
# bandit: the Python SAST gate (issue #962), PINNED THROUGH THE LOCK rather than
# fetched with `uvx` at run time. A linter's ruleset moves between releases, and
# .woodpecker.yml already states what that costs - "running the gate under two
# different linters would make the control's verdict depend on which container
# reached it" - which is why it pins shellcheck by digest. Declaring bandit here
# buys the same parity through uv.lock, and buys it offline: after `uv sync` the
# gate needs no network, which is what lets `make bandit-audit` join `verify`
# where `make dep-audit` deliberately cannot.
dev = ["bandit>=1.9,<2", "mypy>=1.10", "pytest>=8.0", "pytest-timeout>=2.3", "pytest-xdist>=3.6", "ruff>=0.4", "types-PyYAML>=6.0", "types-requests>=2.31"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Per-test wall-clock cap: a single wedged test aborts with a traceback instead
# of silently eating the runner's whole-suite budget (issue #537). Dogfoods the
# per-test-timeout the finish runner recommends to every project.
timeout = 120

[tool.mypy]
python_version = "3.11"
# codex/skills holds byte-identical bundled copies of scripts/*.py (issue
# #555); checking them re-checks the originals and collides on module names.
# `controls/` holds negative-control FIXTURES (issue #924): deliberately
# near-identical bad/good pairs, so their module names collide by
# construction, and frozen historical ANCHORS that must stay byte-identical to
# the commit they are vendored from - type-checking either is meaningless.
# The #953 forced-claim prototype's `cases/` is the same situation one
# directory over (issue #953): each case is a PAIRED tree - `base/` is the
# pre-fix code, `head/` the post-fix code - and its tier-2 match test runs the
# same named test against both, so `base/calc.py` and `head/calc.py` MUST
# share a module name or the fixture stops modelling what it exists to model.
# It sits outside the `controls` entry only because a prototype is not a
# shipped gate; if it is ever promoted into `controls/`, this entry is
# redundant and should be removed rather than left behind.
# NOT UNCHECKED - checked elsewhere: these fixtures are exercised by
# `forced-claim-check.py --selftest`, which runs all nine against their
# registered verdicts (9/9, with a demonstrated red at 3/9 when the checker is
# wedged at VERIFIED). mypy is not the instrument that covers them.
# WHAT WOULD MOVE THIS BACK (issue #936): this exclusion holds only while
# those paths remain deliberately-colliding paired fixture trees. If that
# directory ever holds ordinary library code - anything meant to be imported
# rather than materialized into a temp tree and run - the exclusion has
# widened past its reason and must be narrowed or dropped, not inherited.
exclude = [
    "mcp-second-opinion",
    "codex/skills",
    "controls",
    "docs/research/forced-claim-prototype-2026-09-15/cases",
]
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."
disable_error_code = ["var-annotated", "assignment", "arg-type", "attr-defined"]

[tool.ruff]
target-version = "py311"
line-length = 120
# A negative-control ANCHOR is a frozen copy of a historical commit (issue
# #924). `ruff --fix` would rewrite it and break the byte-identity that is the
# only thing making it evidence, so anchors are not linted. Fixtures are.
exclude = ["controls/*/anchors"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
