# Claude Power Pack - Woodpecker CI Pipeline
# Runs quality gates.
#
# Pipeline:
#   PR/push -> secret-scan -> validate (lint+test+typecheck) + codex-skills-check
#              + delegated-core-check + dependency-audit + bandit-audit
#              + eli5-vendor-check
#              + eli5-upstream-drift (advisory)
#              + tool-risk-drift
#
# The Docker MCP runtime (second-opinion + aws-secrets-agent images, compose
# policy checks, image CVE/SBOM scans, and the runtime smoke stage) was retired
# in issue #469 when mcp-second-opinion moved to its own external repo. CPP no
# longer builds or ships container images.
#
# THE `dockerfile-lint` STEP WAS RETIRED WITH IT (issue #943), one repository
# state later. #469 stopped BUILDING images but left one Dockerfile in the tree -
# `mcp-evaluate/deploy/Dockerfile` - so the hadolint step still had a population
# of one. #943 retired `mcp-evaluate/` entirely, and that was the last Dockerfile
# CPP carried.
#
# The step was DELETED rather than left in place, and the reason is the reason
# this pipeline has negative controls at all. Its command was
# `find . -name Dockerfile -print0 | xargs -0 -r hadolint`, and `xargs -r` does
# not run the command on empty input: over a tree with no Dockerfile it exits 0,
# having linted nothing, printing the same green as a tree whose Dockerfiles all
# passed. That is a blind instrument in ADR 0008's exact sense - a zero-file
# population is UNKNOWN, never clean - and an absent step is strictly more honest
# than a green one that cannot fail. Anyone adding a Dockerfile to CPP must
# restore this step with it; nothing here will notice its absence for them.

when:
  - event: [push, pull_request]

steps:
  secret-scan:
    image: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    commands:
      - gitleaks detect --source . --config .gitleaks.toml --verbose
      # Stage the PINNED binary for the negative-controls step, exactly as the
      # shellcheck step does (#935). `scripts/secret-scan-check.sh` is a
      # registered control, and the harness REFUSES to skip a control it cannot
      # run - it reports UNSIGNALLED and fails - so gitleaks must be present in
      # `validate`, not merely somewhere in the pipeline.
      #
      # Note this step scans WITHOUT `--no-git` (git history) while
      # `make secret-scan` and the control pass it (working tree). Two
      # populations; the control covers the second and says so.
      - mkdir -p .ci-bin && cp "$(command -v gitleaks)" .ci-bin/gitleaks

  # `jq`, CONTENT-PINNED, staged into `.ci-bin` for the steps below (issue #1017).
  # `controls/flow-driver-retirement-check` is the first registered control whose
  # gate needs jq, and this image has none - so the gate reported `unknown` on
  # every case, the register reported BLIND, and CI went red. It did exactly what
  # it should: the harness REFUSES to skip a control it cannot run.
  #
  # The pytest module was the worse half. Its `skipif(which("jq") is None)` made
  # all 26 of its tests SKIP here while `validate` stayed green - load-bearing on
  # a dev box, inert in the one environment a reviewer can re-derive.
  #
  # Pinned by SHA256 rather than by tag, for the reason the shellcheck step
  # states about itself: running a gate under two different tool versions makes
  # the control's verdict depend on which container reached it. Not hypothetical
  # here - `scripts/flow-wave-registry.sh` carries a "#699 jq-1.6 update trap"
  # comment about an expression that DELETES the key it was told to update on one
  # version and not the other. Python does the fetch because this image is
  # guaranteed to have python3 and is not guaranteed to have curl or wget.
  jq-stage:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    depends_on: [secret-scan]
    commands:
      - python3 scripts/ci-stage-jq.py

  validate:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    depends_on: [secret-scan, shellcheck-stage, jq-stage]
    # THE CAP IS DECLARED, NEVER `auto` (issues #640, #1086). `-n auto` means one
    # worker per core, and `nproc` is 24 on the agent host while flow sessions run
    # full suites beside the pipeline; multiplied by the invocations actually in
    # flight, the first symptom is intermittent reds that read as regressions.
    # 8 is where the 5.34x was measured, and `WOODPECKER_MAX_WORKFLOWS=2` bounds
    # the agent to two pipelines, so this step can claim at most 16 of 24 cores.
    # `scripts/pytest-workers.sh` resolves it through the SAME precedence
    # `lib/cicd/steps.py` implements and prints the number it chose, so the cap is
    # in this step's log rather than inferred from the yaml by a reader.
    environment:
      PYTEST_WORKERS: "8"
    commands:
      - uv sync --extra dev --frozen
      - uv run ruff check .
      # `.ci-bin` carries the pinned shellcheck staged by shellcheck-stage
      # and the pinned jq staged by jq-stage.
      # test_the_real_control_discriminates_and_its_anchor_is_blind drives the
      # WHOLE control register, so this image needs every registered control's
      # tool - not just the ones whose own step happens to run here (#960).
      - PATH="$PWD/.ci-bin:$PATH" uv run pytest -n "$(sh scripts/pytest-workers.sh)"
      - uv run mypy .

  # Explicit Codex-skill drift gate (issue #556): the pytest suite already checks
  # currency via test_codex_skill_sync.py, but a dedicated step makes an out-of-sync
  # codex/skills/ fail CI loudly on its own line. The generator is stdlib-only and
  # git-free, so it runs directly under the slim image (no `make`, matching the
  # uv-direct style of the steps above). Same command `make codex-skills-check` wraps.
  codex-skills-check:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    depends_on: [secret-scan]
    commands:
      - python3 scripts/codex-skill-sync.py --check

  # Vendored delegated-driver core (issue #1011). `/codex:auto`, `/qwen:auto` and
  # `/gemma:auto` render one shared lifecycle from
  # templates/delegated-driver-core.md; this step fails loudly on its own line
  # when a rendered region stops matching, rather than leaving the drift to be
  # noticed the next time someone fixes the same bug three times (#774).
  # Stdlib-only and git-free, like codex-skills-check above, so it runs directly
  # under the slim image. Same command `make delegated-core-check` wraps.
  delegated-core-check:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    depends_on: [secret-scan]
    commands:
      - python3 scripts/delegated-core-vendor.py check

  # docs/scripts.md population gate (issue #1013). The inventory of `scripts/`
  # was hand-maintained and derived from nothing, so a script could be added and
  # its entry never written - 17 of 68 were in that state - while six test
  # modules quoted sentences out of the file as if it were complete. This step
  # fails loudly on its own line when the population stops matching the tree,
  # in either direction: a script with no entry, or an entry for a script that
  # no longer exists. Stdlib-only and git-free, like the two steps above, so it
  # runs directly under the slim image. Same command `make scripts-inventory-check`
  # wraps. Its ability to FAIL is proven separately by controls/scripts-inventory,
  # which the `validate` pytest run drives.
  scripts-inventory-check:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    depends_on: [secret-scan]
    commands:
      - python3 scripts/scripts-inventory-check.py

  # ADR 0008's census MEMBERSHIP, derived from scripts/ (issue #1060). Its own
  # line for the reason every gate above got one: "an instrument was added and
  # nobody enumerated it" is a different diagnosis from a lint failure, and this
  # one is upstream of every coverage number the repository quotes - the
  # denominator `negative-controls` prints is this table's row count.
  #
  # Stdlib-only, offline and git-free, so it runs directly under the slim image.
  # Same command `make instrument-census-check` wraps. Its ability to FAIL is
  # proven separately by controls/instrument-census, which the `negative-controls`
  # step and the `validate` pytest run both drive.
  instrument-census-check:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    depends_on: [secret-scan]
    commands:
      - python3 scripts/instrument-census-check.py

  # The Codex-consolidation ledger's completeness (issue #1068). Its own line
  # because the diagnosis is unlike any gate above it: not "a check failed" but
  # "an obligation of the retiring repository is accounted for nowhere". The
  # children that read the ledger do not re-derive it, so an omission here is
  # not caught later - it is caught never, and the capability is simply gone at
  # archive time.
  #
  # Compares against a COMMITTED snapshot rather than querying GitHub, so it is
  # stdlib-only, offline and git-free and runs directly under the slim image.
  # That also means it is deliberately blind to issues opened after the
  # baseline; `--refresh` on a networked host is what moves the baseline, and a
  # refresh that adds a number is expected to turn this red. Same command
  # `make consolidation-ledger-check` wraps. Its ability to FAIL is proven
  # separately by controls/ledger-completeness, which the `negative-controls`
  # step and the `validate` pytest run both drive.
  consolidation-ledger-check:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    depends_on: [secret-scan]
    commands:
      - python3 scripts/check-consolidation-ledger.py

  # Dependency vulnerability audit (issue #961). CPP ran none: both sets of
  # advisories it carried were found by a person looking - #922 on the root lock,
  # #943 on mcp-evaluate - and the only variable was whether anyone was looking
  # that week. Both are now resolved (#922 by upgrading, #943 by retiring the
  # subproject), which is why this step's ledger is empty; the step remains
  # because "nothing to report today" and "nobody is looking" are the two states
  # it exists to keep apart.
  #
  # Its own step, not folded into `validate`, for the reason #556 and #591 each
  # got one: an advisory lands on its own line rather than inside a lint
  # failure. Unlike the three steps above it this one is NOT stdlib-only and NOT
  # offline - it needs `uv` (present in this image) and the OSV advisory feed -
  # which is exactly why `make verify` does not carry it and why its negative
  # control replays committed captures instead of auditing live.
  #
  # `--selftest` RUNS FIRST, AND THAT ORDER IS THE POINT. A broken scan's zeros
  # look exactly like real ones, so before any clean verdict is issued the same
  # live path is pointed at a 2019 PyYAML pin it must report and a clean pin it
  # must not. Its ability to DISCRIMINATE on replayed input is proven separately
  # by controls/dependency-audit, which the `validate` pytest run and the
  # negative-controls step both drive.
  #
  # HARD, with no `failure: ignore`: a finding exits 1, a suppression that
  # suppresses nothing exits 1, and UNKNOWN - pip-audit unreachable, `uv`
  # missing, the feed down, or a zero-file population - exits 2. Unknown is not
  # a pass (the shellcheck gate's rule for a missing binary), and "no advisories
  # found" and "could not reach the feed" never print the same sentence, which
  # is what issue #961 asks to be decided explicitly.
  dependency-audit:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    depends_on: [secret-scan]
    commands:
      - python3 scripts/dependency-audit.py --selftest
      - python3 scripts/dependency-audit.py

  # Python static security analysis (issue #962). CPP ran no SAST at all, over
  # 113 tracked files under lib/ and scripts/ - while lib/security/ is this
  # repository's own secret scanner and lib/creds/ handles credential
  # retrieval. A repository shipping security tooling that runs no static
  # analysis over that tooling is the gap this step closes.
  #
  # ITS OWN STEP, not folded into `validate`, for the reason #556, #591 and
  # #961 each got one: a security finding lands on its own line rather than
  # inside a lint failure.
  #
  # `uv sync --frozen` because bandit is PINNED IN THE DEV EXTRA rather than
  # fetched with `uvx`. A linter's ruleset moves between releases, and the
  # shellcheck steps below already record what that costs - "running the gate
  # under two different linters would make the control's verdict depend on
  # which container reached it". The lock buys the same parity for a Python
  # tool, which cannot be pinned by image digest the way a static binary can.
  #
  # `--selftest` RUNS FIRST, AND THAT ORDER IS THE POINT. A broken scan's zeros
  # look exactly like real ones, so before any clean verdict is issued the same
  # live path is pointed at a committed fixture holding a B307 `eval` it must
  # report and a clean fixture it must not. Its ability to ADJUDICATE on
  # replayed input is proven separately by controls/bandit-audit, which the
  # `validate` pytest run and the negative-controls step both drive - and which
  # replays captures precisely because THIS binary is absent from the bare
  # `python3` those steps run.
  #
  # HARD, with no `failure: ignore`: an unaccounted MEDIUM+ finding exits 1, a
  # stale allowlist line exits 1, an inline `# nosec` or any `--skip` reaching
  # the tool exits 1, and UNKNOWN - bandit unavailable, a file it could not
  # parse, a zero-file population, an unreadable ledger - exits 2. Unknown is
  # not a pass (the shellcheck gate's rule for a missing binary), and "no
  # finding" and "could not look" never print the same sentence.
  bandit-audit:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    depends_on: [secret-scan]
    commands:
      - uv sync --extra dev --frozen
      - uv run python scripts/bandit-audit.py --selftest
      - uv run python scripts/bandit-audit.py

  # Vendored eli5-gate core gates (issue #591). The canonical home of the
  # /flow:eli5 necessity gate is cooneycw/eli5-gate; CPP vendors its core
  # between the eli5-core markers. The drift script for that link existed and
  # worked but was invoked by NOTHING - no step, no target, no test - so a stale
  # core was invisible. Two steps, because they catch different failures:
  #
  #   eli5-vendor-check   HARD gate, offline. Verifies the checked-in core still
  #                       matches the hash pinned in .claude/eli5-vendor.json,
  #                       i.e. nobody edited the vendored copy instead of the
  #                       canonical repo. Stdlib-only and network-free, so it
  #                       runs directly under the slim image (no curl, no git -
  #                       the #451/#489 trap).
  #   eli5-upstream-drift ADVISORY, network. The manifest pins what WAS vendored
  #                       and therefore cannot notice that upstream MOVED; only
  #                       a live fetch can. `failure: ignore` plus the script's
  #                       own fail-open behavior means neither drift nor an
  #                       offline runner can redden the pipeline - it reports.
  eli5-vendor-check:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    depends_on: [secret-scan]
    commands:
      - python3 scripts/eli5-vendor.py

  eli5-upstream-drift:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    depends_on: [secret-scan]
    failure: ignore
    commands:
      - python3 scripts/eli5-vendor.py --upstream

  # Shared permission-risk taxonomy gate (issue #576). CPP classifies command
  # risk in TWO places that must agree on what is dangerous: the canonical
  # scripts/classify-tool-risk.py (used by /security:permissions) and the
  # inline copy vendored into scripts/hook-permission-census.sh (kept
  # self-contained so the census hook stays fail-open). If DESTRUCTIVE_TOKENS
  # or CODE_EXEC drift apart, a command one classifier calls dangerous can be
  # proposed as an allow rule by the other - the taxonomy is safety-critical,
  # so this is a HARD gate (--strict, exit 1), not an advisory.
  #
  # The guard shipped with #495 documenting --strict "(for CI)" and was then
  # wired into nothing at all - no step, no target, no test - the same
  # dormant-capability shape #591 fixed for the eli5 vendor link. Stdlib-only
  # and git-free, so it runs directly under the slim image (the #451/#489 trap).
  tool-risk-drift:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    depends_on: [secret-scan]
    commands:
      - python3 scripts/tool-risk-drift.py --strict

  # Negative controls (issue #924). Every registered gate must still DISCRIMINATE -
  # report BAD on a known-bad input and GOOD on a known-good one - and each control
  # must be demonstrated against an anchor that MISSES the known-bad input, which is
  # what proves the control would notice the gate regressing. A control carrying no
  # anchor is UNPROVEN and fails here: forgetting to prove a control can fail
  # produces a red rather than a silence, which is the whole point.
  #
  # A non-zero exit is NOT by itself a detection (issue #946). A gate that crashes
  # exits non-zero too, so this step reads the gate's OUTPUT as well: the manifest's
  # `detect_signal` must appear, or the verdict is UNSIGNALLED and the step reddens.
  # Before that, this step was green for a gate that fell over and reported nothing.
  #
  # Its own step, not folded into `validate`, so a gate that stops discriminating
  # fails on its own line - the same reason #556 and #591 each got one. Stdlib-only
  # and GIT-FREE: the anchor is vendored precisely because git is absent from this
  # image (the #451/#489/#577 trap), so provenance reports `unverified` here and is
  # byte-verified against git history on a dev box and in the pre-push hook.
  negative-controls:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim@sha256:4f5d923c9dcea037f57bda425dd209f3ec643da2f0b74227f68d09dab0b3bb36
    depends_on: [secret-scan, shellcheck-stage, jq-stage]
    commands:
      # `.ci-bin` carries the PINNED shellcheck staged by shellcheck-stage
      # and the PINNED jq staged by jq-stage.
      # The harness refuses to SKIP a control it cannot run - so a registered
      # control's tool must be present HERE, not merely somewhere in the
      # pipeline. Since #1117 it reports that refusal as UNAVAILABLE rather than
      # UNSIGNALLED or BLIND, which is a better DIAGNOSIS and deliberately not a
      # softer verdict: BARE `--strict` still fails on it.
      #
      # DO NOT ADD `--allow-unavailable` HERE. That flag exists for `make verify`
      # on a developer box, which may legitimately lack gitleaks, shellcheck or
      # jq. This step stages all three on purpose, so an absent one means a
      # staging step stopped delivering - and the note under `shellcheck-stage`
      # below, plus tests/test_shellcheck_stage.py, both rest on this step
      # REDDENING in exactly that case rather than reporting a shorter battery.
      - PATH="$PWD/.ci-bin:$PATH" python3 scripts/check-negative-controls.py --strict

  # STAGING ONLY, SPLIT OUT OF THE GATE (issue #1086). `validate` depends on the
  # shellcheck side of the pipeline for exactly one thing - the PINNED binary in
  # `.ci-bin` - and the copy takes about a second. The gate that produced it in
  # the same step takes THIRTY, measured directly rather than inferred from the
  # step time:
  #
  #     $ time sh scripts/shellcheck-gate.sh
  #     shellcheck-gate: ok - 103 file(s) scanned at severity=error, 0 findings.
  #     real  0m30.381s
  #
  # So `pytest` - 84% of this pipeline's wall clock - sat behind a lint whose
  # OUTPUT it never reads. `jq-stage` above already had the right shape; this is
  # the same split applied to the tool that predates it. The gate itself keeps
  # running, unchanged, in the fan-out below where nothing waits on it.
  #
  # PINNING IS THE WHOLE POINT OF STAGING, not a detail of it: apt in that image
  # supplies shellcheck 0.9.0 while this pins 0.10.0, and running the gate under
  # two different linters would make `controls/shellcheck-gate`'s verdict depend
  # on which container reached it.
  #
  # WHAT HAPPENS IF THIS STEP SILENTLY STOPS STAGING: the consumers do NOT go
  # quietly green. `scripts/shellcheck-gate.sh` reports UNKNOWN and exits 2 when
  # the binary is absent - never 0 - and `check-negative-controls.py` refuses to
  # SKIP a control it cannot run, so `negative-controls` reddens rather than
  # reporting a shorter battery. Unchanged by #1117: that issue renamed the
  # verdict here from UNSIGNALLED to UNAVAILABLE, which is a different DIAGNOSIS
  # and not a softer one - the step above passes bare `--strict`, which fails on
  # it exactly as before. `tests/test_shellcheck_stage.py` holds that
  # refusal as a committed case, because "the tool was there on every run so far"
  # is not evidence about what happens when it is not.
  shellcheck-stage:
    image: koalaman/shellcheck-alpine:v0.10.0@sha256:5921d946dac740cbeec2fb1c898747b6105e585130cc7f0602eec9a10f7ddb63
    pull: true
    depends_on: [secret-scan]
    commands:
      - mkdir -p .ci-bin && cp /bin/shellcheck .ci-bin/shellcheck

  shellcheck:
    image: koalaman/shellcheck-alpine:v0.10.0@sha256:5921d946dac740cbeec2fb1c898747b6105e585130cc7f0602eec9a10f7ddb63
    pull: true
    depends_on: [secret-scan]
    commands:
      # The gate derives its own file list and prints the denominator it
      # examined. This image has no git, so it falls back to a pruned find and
      # says `source=find` - which is also the blind spot worth naming: a CI
      # clone has no untracked files, so untracked scripts are visible ONLY to
      # `make shellcheck` locally. Neither surface sees the whole universe.
      #
      # NOTHING DEPENDS ON THIS STEP since #1086 - the staging moved to
      # `shellcheck-stage` above - so its 30s is off the critical path. It is
      # still a HARD gate: a finding here reddens the pipeline on its own line.
      - sh scripts/shellcheck-gate.sh
