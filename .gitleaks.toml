# Gitleaks configuration for claude-power-pack
# https://github.com/gitleaks/gitleaks
#
# Local usage:  make secret-scan
# CI usage:     runs automatically in Woodpecker pipeline before validate step

[extend]
useDefault = true

# Global allowlist - paths and patterns that are known false positives
[allowlist]
  paths = [
    # CONSTITUTIVE, not reactive - the one entry here that is different in kind
    # (issue #935). Every other entry below is REACTIVE: production content
    # tripped a heuristic and the gate was made more permissive about it. This
    # one covers a finding that exists ONLY because we planted it, as the
    # negative control proving this gate can fail at all.
    #
    # That distinction erodes - "it's a fixture" becomes "it's test data" becomes
    # "it's a doc" - so guards carry it rather than this comment:
    #   controls/secret-scan/ scans the SAME BYTES relocated off this path and
    #   requires DETECTION, so the entry cannot be blinding the gate generally;
    #   tests/test_secret_scan.py requires that REMOVING this entry turns the
    #   repo-wide scan RED, so the entry cannot be decorative.
    #
    # REVERSAL TRIGGER (#936): if a SECOND allowlist entry ever points into
    # controls/, this carve-out has stopped being constitutive and become a
    # habit. Checkable by reading this file - no report needed. Then the fixture
    # moves out of the scanned population, or the control is rebuilt.
    '''controls/secret-scan/cases/''',
    # Virtual environments and caches
    '''\.venv/''',
    '''__pycache__/''',
    '''\.mypy_cache/''',
    '''node_modules/''',
    # Lock files
    '''uv\.lock$''',
    # Documentation with example/placeholder credentials
    '''docs/AWS_SECRETS_SIDECAR\.md$''',
    '''\.claude/commands/secrets/validate\.md$''',
    '''\.claude/commands/security/explain\.md$''',
    '''\.claude/commands/cpp/init\.md$''',
    '''\.claude/commands/second-opinion/help\.md$''',
    '''INSTALLATION_ISSUES\.md$''',
    # Grill-yourself transcripts quote commands/tool-output (image names, secret
    # handling) that trip generic-api-key heuristics; they are provenance docs.
    '''\.specify/grills/''',
    # Security scanner/masking code references key patterns for detection
    '''lib/security/explain\.py$''',
    '''lib/creds/masking\.py$''',
    # Secret masking scripts contain test patterns
    '''scripts/secrets-mask\.sh$''',
    # Test fixtures with dummy/example credentials
    '''tests/test_security_scanners\.py$''',
    '''tests/test_security_models\.py$''',
    '''tests/test_creds_masking\.py$''',
  ]
