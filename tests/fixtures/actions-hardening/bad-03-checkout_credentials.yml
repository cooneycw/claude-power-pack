{
  "on": {
    "push": {},
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": "${{ github.event_name == 'pull_request' }}"
  },
  "jobs": {
    "ci": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": "30",
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": "true"
          }
        },
        {
          "run": "python -m pip install uv==0.9.7\nuv sync"
        }
      ]
    },
    "secret-scan": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": "10",
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": "0",
            "persist-credentials": "false"
          }
        },
        {
          "name": "Scan for secrets",
          "run": "docker run --rm --env HOME=/tmp --user \"$(id -u):$(id -g)\" -v \"$PWD:/repo:ro\" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source=/repo --redact --no-banner\n"
        }
      ]
    },
    "deploy": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": "20",
      "environment": "production",
      "if": "github.ref == 'refs/heads/main' && github.event_name == 'push'",
      "needs": [
        "ci",
        "secret-scan"
      ],
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": "false"
          }
        },
        {
          "run": "make deploy"
        }
      ]
    }
  }
}
