<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fixture shop</title></head>
<body>
  <h1>Fixture shop</h1>
  <p>Cart: <span data-testid="cart-count">0</span></p>
  <button type="button" id="add">Add to cart</button>
  <script>
    const count = document.querySelector('[data-testid="cart-count"]');
    const add = () => { count.textContent = String(Number(count.textContent) + 1); };
    document.getElementById('add').addEventListener('click', add);
    // THE BUG: a second listener bound to the same button, so one click adds two.
    // It must be a DISTINCT function - the DOM silently drops a second
    // registration of the same reference, which made an earlier draft of this
    // fixture a "bug" that never happened (caught by its own buggy arm passing).
    document.getElementById('add').addEventListener('click', () => add());
  </script>
</body>
</html>
