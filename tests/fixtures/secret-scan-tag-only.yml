steps:
  - name: secret-scan
    image: zricethezav/gitleaks:v8.30.1
    commands:
      - |
        cat > .gitleaks-findings.tmpl <<'TMPL'
        {{- range . }}RuleID: {{ .RuleID }}
        File: {{ .File }}
        Line: {{ .StartLine }}

        {{ end -}}
        TMPL
      - if [ -f ".gitleaks.toml" ]; then gitleaks detect --source . --config ".gitleaks.toml" --redact --report-format template --report-template .gitleaks-findings.tmpl --report-path -; else gitleaks detect --source . --redact --report-format template --report-template .gitleaks-findings.tmpl --report-path -; fi
