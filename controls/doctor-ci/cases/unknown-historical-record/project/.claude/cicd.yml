# .claude/cicd.yml - CI/CD configuration for Claude Power Pack
#
# Framework and package manager are auto-detected (Python + uv).
# This file configures quality gates and recommendations.

build:
  required_targets:
    - lint
    - test

  recommended_targets:
    - format
    - typecheck
    - verify
    - clean

# Deploy verification (issue #603): CPP ships no services - `make deploy` is the
# #469 informative no-op - but this repo OWNS lib/cicd's verify code, and with
# no stanza here VERIFY_ENABLED stayed 0, so the one repo that owns the verify
# path never executed it (how the pre-#595 broken invocation survived for
# months). The probe is meaningful for a service-less repo: it proves the
# shipped library imports. Step 9 now runs `verify --baseline` + `verify`
# around the no-op deploy on every CPP flow run.
health:
  deploy_verification:
    enabled: true
  smoke_tests:
    - name: lib-cicd-imports
      command: python3 -c "import lib.cicd"
