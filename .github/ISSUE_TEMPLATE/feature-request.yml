name: Feature Request
description: Request a new command, skill, or capability
labels: ["enhancement", "feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new feature? We'd love to hear it!

  - type: dropdown
    id: type
    attributes:
      label: Feature type
      options:
        - New slash command
        - New skill
        - MCP server enhancement
        - Hook/automation
        - Documentation addition
        - Integration
        - Other
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Feature name
      description: A short name for this feature
      placeholder: "e.g., /spec:adopt command"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem and intended outcome
      description: What problem does this solve, and what should be true once it is solved? This is the part that is binding.
      placeholder: |
        As a [type of user], I want to [do something]
        so that [benefit/outcome].
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints (optional)
      description: Boundaries any solution must respect, each with the reason behind it. A reason is what lets someone challenge a constraint on the merits instead of guessing.
      placeholder: |
        - Must not add a new runtime service - we run a single container and intend to keep it that way.
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Proposed approach (optional)
      description: If you have a design in mind, describe it here. This is recorded as a revisable suggestion, not a requirement - an implementer may deliver the outcome above a different way and will say why. Leave it blank if you would rather not prescribe one.
      placeholder: |
        Describe the approach you have in mind:
        - What would the user do?
        - What would happen?
        - What output would they see?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other solutions have you tried or considered?
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help implement this feature
          required: false
